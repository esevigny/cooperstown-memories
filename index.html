<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cooperstown Memories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
  /* Layout: a single centered column; a vertical timeline rail on the left,
     one full-width video per stop, grouped by game */
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --fg: #17202e;
    --muted: #5b6474;
    --line: #d6dbe2;
    --accent: #b8242b;
    --display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10141b;
      --surface: #1a2029;
      --fg: #e9ecf1;
      --muted: #9aa3b1;
      --line: #2d3440;
      --accent: #ec5a60;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 17px/1.55 var(--body);
  }
  .wrap {
    max-width: 1040px;
    margin: 0 auto;
    padding: 40px 20px 72px;
    display: grid;
    gap: 36px;
  }

  header { display: grid; gap: 10px; }
  .eyebrow {
    margin: 0;
    font: 600 0.85rem/1 var(--body);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--accent);
  }
  h1 {
    margin: 0;
    font: 700 clamp(2.4rem, 7vw, 4rem)/0.95 var(--display);
    text-transform: uppercase;
    letter-spacing: 0.01em;
    text-wrap: balance;
  }
  .subtitle { margin: 0; color: var(--muted); max-width: 60ch; }

  .controls {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    padding-top: 6px;
  }
  .controls span { color: var(--muted); font-size: 0.95rem; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button {
    font: 600 0.95rem/1 var(--body);
    color: var(--fg);
    background: var(--surface);
    border: 0;
    padding: 9px 16px;
    cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Timeline */
  .timeline { display: grid; gap: 44px; }
  .game { display: grid; gap: 28px; }
  .game-head {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--fg);
  }
  .game-head h2 {
    margin: 0;
    font: 700 1.9rem/1 var(--display);
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .game-head .date { color: var(--muted); font-weight: 600; }

  .stops { display: grid; gap: 36px; position: relative; padding-left: 30px; }
  .stops::before {
    content: ""; position: absolute; left: 7px; top: 8px; bottom: 8px;
    width: 2px; background: var(--line);
  }
  .stop { display: grid; gap: 12px; position: relative; min-width: 0; }
  .stop::before {
    content: ""; position: absolute; left: -30px; top: 6px;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--bg); border: 3px solid var(--accent);
  }
  .stop.final::before { background: var(--accent); }
  .stop-head {
    display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px;
  }
  .stop h3 { margin: 0; font: 600 1.35rem/1.2 var(--body); }
  .stop-meta { display: flex; align-items: center; gap: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .fs {
    font: 600 0.9rem/1 var(--body);
    color: var(--accent);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 7px 11px;
    cursor: pointer;
  }
  .fs:hover { border-color: var(--accent); }

  .player {
    position: relative;
    width: 100%;
    max-width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 6px;
    overflow: hidden;
  }
  .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .note { margin: 0; color: var(--muted); }

  footer { color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }

  @media (max-width: 480px) {
    .stops { padding-left: 22px; }
    .stops::before { left: 5px; }
    .stop::before { left: -22px; width: 12px; height: 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="site-title"></h1>
    <p class="subtitle" id="site-subtitle"></p>
    <div class="controls">
      <span>Order:</span>
      <div class="seg" role="group" aria-label="Timeline order">
        <button type="button" id="order-forward" aria-pressed="true">Start to finish</button>
        <button type="button" id="order-reverse" aria-pressed="false">Championship first</button>
      </div>
    </div>
  </header>

  <main class="timeline" id="timeline"></main>

  <footer id="footer"></footer>
</div>

<script>
  /* ===== EDIT HERE =====================================================
     Games are listed in the order they happened; videos inside each game
     are too. Paste a Vimeo or YouTube link as the url. "length" is m:ss.
  ====================================================================== */
  const SITE = {
    eyebrow: "Red Devils",
    title: "Cooperstown Memories",
    subtitle: "The run to the Cooperstown championship, July 2022."
  };

  const GAMES = [
    {
      name: "Semifinal",
      date: "",
      videos: [
        { title: "Semifinal, 8 HR", url: "https://vimeo.com/728680973/b036b01d5e", length: "7:56" }
      ]
    },
    {
      name: "Championship Game",
      date: "July 9, 2022",
      videos: [
        { title: "Announcing the Red Devils!", url: "https://vimeo.com/728918350", length: "2:44" },
        { title: "Championship!", url: "https://vimeo.com/728599497/89dd0a225b", length: "1:23" },
        { title: "Rushing the Field", url: "https://vimeo.com/728887107", length: "1:28" }
      ]
    }
  ];
  /* ===================================================================== */

  function embedUrl(url) {
    try {
      const u = new URL(url);
      const host = u.hostname.replace(/^www\./, "");
      if (host === "player.vimeo.com") { u.searchParams.set("badge", "0"); return u.toString(); }
      if (host === "vimeo.com") {
        const parts = u.pathname.split("/").filter(Boolean);
        const id = parts.find(p => /^\d+$/.test(p));
        if (!id) return null;
        const hash = parts[parts.indexOf(id) + 1];
        let src = "https://player.vimeo.com/video/" + id + "?badge=0&title=0&byline=0&portrait=0";
        if (hash && /^[0-9a-f]+$/i.test(hash)) src += "&h=" + hash;
        return src;
      }
      if (host === "youtu.be") return "https://www.youtube-nocookie.com/embed/" + u.pathname.slice(1);
      if (host.endsWith("youtube.com")) {
        if (u.searchParams.get("v")) return "https://www.youtube-nocookie.com/embed/" + u.searchParams.get("v");
        const m = u.pathname.match(/\/(embed|shorts|live)\/([^/?]+)/);
        if (m) return "https://www.youtube-nocookie.com/embed/" + m[2];
      }
    } catch (e) {}
    return null;
  }

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text) n.textContent = text;
    return n;
  }

  const canFullscreen = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);

  function goFullscreen(target) {
    const req = target.requestFullscreen || target.webkitRequestFullscreen;
    if (req) {
      try {
        const p = req.call(target);
        if (p && p.catch) p.catch(() => {});
      } catch (e) {}
    }
  }

  function stop(v, isFinal) {
    const s = el("article", "stop" + (isFinal ? " final" : ""));
    const head = el("div", "stop-head");
    head.appendChild(el("h3", null, v.title));
    const meta = el("div", "stop-meta");
    if (v.length) meta.appendChild(el("span", null, v.length));

    const src = embedUrl(v.url);
    let box;
    if (src) {
      box = el("div", "player");
      const f = document.createElement("iframe");
      f.src = src;
      f.title = v.title;
      f.loading = "lazy";
      f.allow = "autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share";
      f.referrerPolicy = "strict-origin-when-cross-origin";
      f.allowFullscreen = true;
      box.appendChild(f);
      if (canFullscreen) {
        const b = el("button", "fs", "⛶ Full screen");
        b.type = "button";
        b.setAttribute("aria-label", "Play " + v.title + " full screen");
        b.addEventListener("click", () => goFullscreen(f));
        meta.appendChild(b);
      }
    } else {
      box = el("a", "fs", "Watch video ↗");
      box.href = v.url; box.target = "_blank"; box.rel = "noopener";
    }
    head.appendChild(meta);
    s.appendChild(head);
    s.appendChild(box);
    if (v.note) s.appendChild(el("p", "note", v.note));
    return s;
  }

  const timeline = document.getElementById("timeline");
  const lastGame = GAMES.length - 1;

  function render(reverse) {
    timeline.textContent = "";
    const games = GAMES.map((g, gi) => ({ g, gi }));
    if (reverse) games.reverse();
    games.forEach(({ g, gi }) => {
      const sec = el("section", "game");
      const head = el("div", "game-head");
      head.appendChild(el("h2", null, g.name));
      if (g.date) head.appendChild(el("span", "date", g.date));
      sec.appendChild(head);
      const list = el("div", "stops");
      const vids = g.videos.map((v, vi) => ({ v, isFinal: gi === lastGame && vi === g.videos.length - 1 }));
      if (reverse) vids.reverse();
      vids.forEach(({ v, isFinal }) => list.appendChild(stop(v, isFinal)));
      sec.appendChild(list);
      timeline.appendChild(sec);
    });
    document.getElementById("order-forward").setAttribute("aria-pressed", String(!reverse));
    document.getElementById("order-reverse").setAttribute("aria-pressed", String(reverse));
    try { localStorage.setItem("cm-order", reverse ? "reverse" : "forward"); } catch (e) {}
  }

  document.getElementById("eyebrow").textContent = SITE.eyebrow;
  document.getElementById("site-title").textContent = SITE.title;
  document.getElementById("site-subtitle").textContent = SITE.subtitle;
  document.title = SITE.title;

  document.getElementById("order-forward").addEventListener("click", () => render(false));
  document.getElementById("order-reverse").addEventListener("click", () => render(true));

  let saved = "forward";
  try { saved = localStorage.getItem("cm-order") || "forward"; } catch (e) {}
  render(saved === "reverse");

  const all = GAMES.flatMap(g => g.videos);
  const secs = all.reduce((t, v) => {
    const m = /^(\d+):(\d{2})$/.exec(v.length || "");
    return t + (m ? (+m[1]) * 60 + (+m[2]) : 0);
  }, 0);
  document.getElementById("footer").textContent =
    all.length + " videos · " + Math.floor(secs / 60) + ":" + String(secs % 60).padStart(2, "0") + " total";
</script>
</body>
</html>
